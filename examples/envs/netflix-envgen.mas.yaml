# mas-env/1 manifest, generated by scripts/import-env.mjs from envgen
contract: mas-env/1
id: netflix_local_r212
name: netflix-local-r212
version: 1.2.0
source:
  format: envgen
  path: forgingground-gen/generated/netflix-local-r212
kind: web_app
runtime:
  compose: docker/docker-compose.yml
  variant: build
  network: bridge
  services:
    - name: database
      image: postgres:16
      port: 8082
    - name: backend
      port: 8078
    - name: frontend
      port: 8079
lifecycle:
  start: docker compose -f docker/docker-compose.yml up -d
  stop: docker compose -f docker/docker-compose.yml down
  health: GET http://127.0.0.1:8078/health
  reset: POST http://127.0.0.1:8078/api/v1/reset
  init_tenant: POST http://127.0.0.1:8078/api/v1/admin/init-tenant
exposes:
  http:
    - name: api
      base: http://127.0.0.1:8078
    - name: ui
      base: http://127.0.0.1:8079
  mcp:
    transport: http
    start: cd mcp_server/app && ./start.sh
    url: http://127.0.0.1:8890/mcp
    auth: oauth_jwks
    env:
      API_BASE_URL: http://127.0.0.1:8078
      PORT: "8890"
    tools:
      - get_continue_watching
      - post_continue_watching
      - get_genres
      - post_genres
      - get_genres_by_id_titles
      - get_my_list
      - post_my_list
      - delete_my_list_by_id
      - get_profiles
      - post_profiles
      - get_search
      - get_titles
      - get_titles_top10
      - get_titles_trending
      - get_titles_by_id
      - get_titles_by_id_episodes
      - post_titles_by_id_rating
auth:
  mode: embedded
  login: POST http://127.0.0.1:8078/auth/login
  test_users: []
state:
  seed:
    - app/database/init/01_init.sql
    - app/backend/seed_data.json
    - app/backend/seed_dataset.json
  snapshots: snapshots
tasks: null
